<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ورود</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    background-image: url("background.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow: hidden;
}

/* کل صفحه */
.login-page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    position: relative;

    display: flex;
    justify-content: flex-start;
    align-items: center;

    flex-direction: column;

    padding-top: 2cm;
}

/* عنوان */
.title {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    color: #243b2b;

    font-size: 30px;
    font-weight: 700;

    text-shadow:
        0 1px 3px rgba(255,255,255,.8);

    margin: 0 0 18px 0;
}

/* جوانه کنار عنوان */
.title-sprout {
    font-size: 27px;
    line-height: 1;
}

/* بخش ورود */
.login-box {
    width: min(82%, 340px);

    display: flex;
    flex-direction: column;
    align-items: center;

    background: transparent;

    padding: 0;
    margin: 0;
}

/* متن درخواست رمز */
.login-text {
    width: 100%;

    text-align: center;

    color: #111;

    font-size: 21px;
    font-weight: 600;

    line-height: 1.8;

    margin-bottom: 13px;

    padding: 5px 12px;

    /*
      فقط یک لایه خیلی ظریف برای خوانایی متن،
      بدون کادر بزرگ دور فرم
    */
    background: rgba(255,255,255,.28);

    border-radius: 12px;
}

/* قسمت رمز */
.password-wrapper {
    width: 100%;

    position: relative;

    margin-bottom: 14px;
}

/* کادر رمز */
#password {
    width: 100%;
    height: 58px;

    padding: 0 52px 0 18px;

    border: 1px solid rgba(50,70,45,.25);

    border-radius: 16px;

    background: rgba(255,255,255,.90);

    color: #222;

    font-size: 22px;

    text-align: center;

    outline: none;

    box-shadow:
        0 3px 12px rgba(0,0,0,.12);
}

/* وقتی داخل کادر کلیک می‌شود */
#password:focus {
    border-color: rgba(91,115,77,.75);

    box-shadow:
        0 0 0 3px rgba(91,115,77,.15),
        0 3px 12px rgba(0,0,0,.12);
}

/* چشم */
.eye-button {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    color: #53694b;

    font-size: 20px;

    cursor: pointer;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* دکمه ورود */
.login-button {
    width: 100%;
    height: 58px;

    border: none;

    border-radius: 16px;

    background: #71865f;

    color: white;

    font-size: 24px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.16);

    transition:
        transform .15s ease,
        background .15s ease;
}

/* حالت لمس */
.login-button:active {
    transform: scale(.98);
}

/* پیام خطا */
.error-message {
    min-height: 28px;

    margin-top: 10px;

    color: #8b2222;

    font-size: 16px;
    font-weight: 600;

    text-align: center;

    text-shadow:
        0 1px 3px rgba(255,255,255,.9);
}


/* مخصوص صفحه‌های خیلی کوچک */
@media (max-height: 700px) {

    .login-page {
        padding-top: 1.5cm;
    }

    .title {
        font-size: 26px;
        margin-bottom: 12px;
    }

    .login-text {
        font-size: 18px;
        margin-bottom: 10px;
    }

    #password,
    .login-button {
        height: 52px;
    }

    .login-button {
        font-size: 22px;
    }
}

</style>
</head>


<body>

<div class="login-page">

    <div class="title">
        <span>مسیر حمایت</span>
        <span class="title-sprout">🌱</span>
    </div>


    <div class="login-box">

        <div class="login-text">
            لطفاً رمز را وارد کنید
        </div>


        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                placeholder=""
                maxlength="6"
                minlength="5"
                autocomplete="off"
                inputmode="text"
            >

            <button
                type="button"
                class="eye-button"
                id="eyeButton"
                aria-label="نمایش رمز"
            >
                👁
            </button>

        </div>


        <button
            type="button"
            class="login-button"
            onclick="checkPassword()"
        >
            ورود
        </button>


        <div
            id="errorMessage"
            class="error-message"
        ></div>

    </div>

</div>


<script>

/*
==================================================
رمز ورود را فقط از این خط تغییر بده
==================================================

مثلاً:

const correctPassword = "Ab123";

برای تغییر هفتگی یا ماهانه،
فقط متن داخل کوتیشن را عوض کن.

حروف بزرگ و کوچک مهم نیستند.
مثلاً Ab123 و ab123 و AB123 یکسان هستند.
اما خود حروف و اعداد باید همان باشند.
*/

const correctPassword = "12345";


/*
==================================================
آدرس سایت اصلی
==================================================
*/

const mainSite =
    "https://roshasupport.github.io/Rosha.github.io/";


/*
==================================================
بررسی رمز
==================================================
*/

function checkPassword() {

    const passwordInput =
        document.getElementById("password");

    const errorMessage =
        document.getElementById("errorMessage");


    const enteredPassword =
        passwordInput.value.trim();


    /*
      تبدیل هر دو رمز به حروف کوچک
      باعث می‌شود بزرگ یا کوچک بودن حروف
      تفاوتی نداشته باشد.
    */

    if (
        enteredPassword.toLowerCase() ===
        correctPassword.toLowerCase()
    ) {

        errorMessage.textContent = "";

        window.location.href = mainSite;

    } else {

        errorMessage.textContent =
            "رمز واردشده صحیح نیست.";

        passwordInput.value = "";

        passwordInput.focus();
    }
}


/*
==================================================
نمایش / مخفی کردن رمز
==================================================
*/

const eyeButton =
    document.getElementById("eyeButton");

const passwordInput =
    document.getElementById("password");


eyeButton.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        eyeButton.textContent = "🙈";

        eyeButton.setAttribute(
            "aria-label",
            "مخفی کردن رمز"
        );

    } else {

        passwordInput.type = "password";

        eyeButton.textContent = "👁";

        eyeButton.setAttribute(
            "aria-label",
            "نمایش رمز"
        );
    }
});


/*
==================================================
امکان ورود با زدن Enter
==================================================
*/

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            checkPassword();

        }

    }
);

</script>

</body>
</html>
