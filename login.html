<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مسیر حمایت</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background-image:url("background.png");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}


/* کل محتوای صفحه */

.login-page{

    width:100%;
    min-height:100vh;

    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:22vh;
}


/* عنوان */

.title-area{

    position:relative;

    width:90%;
    max-width:430px;

    text-align:center;

    margin-bottom:35px;
}


/* تزئینات بسیار ظریف اطراف عنوان */

.title-area::before{

    content:"🌿";

    position:absolute;

    right:4%;
    top:5px;

    font-size:28px;

    opacity:.75;

    transform:rotate(-15deg);
}


.title-area::after{

    content:"🌿";

    position:absolute;

    left:4%;
    bottom:0;

    font-size:28px;

    opacity:.75;

    transform:scaleX(-1) rotate(-15deg);
}


/* عنوان اصلی */

.title{

    display:inline-block;

    color:#263b2d;

    font-size:clamp(28px,7vw,42px);

    font-weight:700;

    line-height:1.5;

    text-shadow:
        0 1px 2px rgba(255,255,255,.9),
        0 2px 5px rgba(255,255,255,.7);

    position:relative;
}


/* بخش ورود */

.login-box{

    width:72%;

    max-width:310px;

    display:flex;
    flex-direction:column;
    align-items:center;

}


/* متن درخواست رمز */

.password-label{

    color:#111;

    font-size:clamp(18px,5vw,23px);

    font-weight:600;

    line-height:1.7;

    margin-bottom:14px;

    text-align:center;

    text-shadow:
        0 1px 3px rgba(255,255,255,.95),
        0 0 8px rgba(255,255,255,.85);

}


/* قسمت رمز */

.password-wrapper{

    width:100%;

    position:relative;

}


/* کادر رمز */

#password{

    width:100%;

    height:58px;

    border-radius:17px;

    border:1px solid rgba(255,255,255,.9);

    background:rgba(255,255,255,.88);

    color:#222;

    font-size:22px;

    text-align:center;

    direction:ltr;

    outline:none;

    padding:0 52px 0 18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.15);

    transition:.2s ease;
}


#password:focus{

    background:rgba(255,255,255,.96);

    border-color:#6f855f;

    box-shadow:
        0 4px 18px rgba(0,0,0,.20);
}


/* دکمه چشم */

.toggle-password{

    position:absolute;

    right:10px;

    top:50%;

    transform:translateY(-50%);

    width:38px;

    height:38px;

    border:none;

    background:transparent;

    color:#56664d;

    cursor:pointer;

    font-size:21px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:0;
}


/* دکمه ورود */

.login-button{

    width:100%;

    height:58px;

    margin-top:14px;

    border:none;

    border-radius:17px;

    background:#6f855f;

    color:white;

    font-size:22px;

    font-weight:bold;

    font-family:inherit;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.18);

    transition:
        transform .15s ease,
        background .2s ease;
}


.login-button:hover{

    background:#637953;
}


.login-button:active{

    transform:scale(.98);
}


/* پیام خطا */

.error-message{

    min-height:28px;

    margin-top:12px;

    color:#8b2020;

    font-size:15px;

    font-weight:bold;

    text-align:center;

    text-shadow:
        0 1px 3px white;

}


/* مخصوص موبایل‌های خیلی کوچک */

@media(max-height:700px){

    .login-page{

        padding-top:15vh;
    }

    .title-area{

        margin-bottom:25px;
    }

    #password,
    .login-button{

        height:52px;
    }

}


/* موبایل‌های خیلی باریک */

@media(max-width:360px){

    .login-box{

        width:76%;
    }

    .title{

        font-size:29px;
    }

    .password-label{

        font-size:18px;
    }

}


/* جلوگیری از انتخاب ناخواسته دکمه */

button{

    -webkit-tap-highlight-color:transparent;
}

</style>
</head>


<body>

<div class="login-page">


    <div class="title-area">

        <div class="title">
            مسیر حمایت
        </div>

    </div>


    <div class="login-box">


        <div class="password-label">
            لطفاً پسورد را وارد کنید
        </div>


        <div class="password-wrapper">

            <input
                id="password"
                type="password"
                autocomplete="off"
                inputmode="text"
                aria-label="پسورد"
            >

            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="نمایش پسورد"
            >
                👁
            </button>

        </div>


        <button
            type="button"
            class="login-button"
            id="loginButton"
        >
            ورود
        </button>


        <div
            class="error-message"
            id="errorMessage"
        ></div>


    </div>

</div>


<script>

/* ==================================================
   فقط این قسمت را برای تغییر رمز عوض کن
   ================================================== */

const PASSWORD = "123456";


/* آدرس سایت اصلی */

const MAIN_SITE =
    "https://roshasupport.github.io/Rosha.github.io/";


/* عناصر صفحه */

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");

const togglePassword =
    document.getElementById("togglePassword");


/* نمایش / مخفی کردن رمز */

togglePassword.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "مخفی کردن پسورد"
            );

        }else{

            passwordInput.type = "password";

            togglePassword.textContent = "👁";

            togglePassword.setAttribute(
                "aria-label",
                "نمایش پسورد"
            );

        }

    }
);


/* ورود */

function login(){

    const enteredPassword =
        passwordInput.value.trim();

    /*
       مقایسه بدون حساسیت به حروف بزرگ و کوچک
       اما خود کاراکترها باید همان کاراکترهای رمز باشند.
    */

    if(
        enteredPassword.toLowerCase() ===
        PASSWORD.toLowerCase()
    ){

        errorMessage.textContent = "";

        window.location.href = MAIN_SITE;

    }else{

        errorMessage.textContent =
            "پسورد صحیح نیست.";

        passwordInput.focus();

    }

}


/* کلیک روی ورود */

loginButton.addEventListener(
    "click",
    login
);


/* امکان زدن Enter */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);

</script>

</body>
</html>
